<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Ocean Shader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		
		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

		<style>
			body {
				margin: 0;
				overflow-x: hidden;
				overflow-y: scroll;
				height: 500vh; /* Allow scrolling */
				font-family: 'Inter', sans-serif;
			}
			#container {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100vh;
				z-index: 1;
			}
			#overlay {
				position: fixed;
				bottom: 0;
				left: 0;
				width: 100%;
				height: 0;
				pointer-events: none;
				z-index: 2;
				background-color: #000;
			}

			/* Hero Styles */
			#hero-wrapper {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
				z-index: 3; /* Above overlay for logo */
			}

			#logo-container {
				position: absolute;
				top: calc(50% - 60px);
				left: 50%;
				transform: translate(-50%, -50%);
				width: 150px;
				height: 150px;
				display: flex;
				align-items: center;
				justify-content: center;
				pointer-events: auto; /* Enable pointer events for hover */
				/* Transition for the movement to top-left */
				/* We will handle top/left via JS or CSS var, but let's use JS for sync with scroll */
			}

			#hero-logo {
				width: 100%;
				height: auto;
				filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
				/* Rotation will be applied here via JS */
				transition: transform 0.1s ease-out, filter 0.3s ease;
				will-change: transform;
			}

			#hero-logo:hover {
				filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
			}

			#hero-text {
				position: absolute;
				top: calc(50% - 60px);
				left: 50%;
				transform: translate(-50%, -50%);
				text-align: center;
				color: white;
				margin-top: 120px; /* Offset from center to be below logo */
				z-index: 2; /* Above container */
				pointer-events: none;
				transition: opacity 0.2s ease-out;
				width: 100%;
			}

			#hero-text h1 {
				font-family: 'Inter', sans-serif;
				font-size: 3rem;
				margin: 0;
				font-weight: 700;
				text-shadow: 0 4px 10px rgba(0,0,0,0.5);
				letter-spacing: -0.02em;
			}

			#hero-text p {
				font-family: 'Inter', sans-serif;
				font-size: 1rem;
				margin: 12px 0 0;
				opacity: 0.9;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				text-shadow: 0 2px 5px rgba(0,0,0,0.5);
				font-weight: 300;
			}

		</style>
	</head>
	<body>

		<div id="hero-wrapper">
			<div id="logo-container">
				<img src="kasseh-logo-white.svg" id="hero-logo" alt="Kasseh Logo">
			</div>
		</div>
		
		<div id="hero-text">
			<h1>Quentin Kasseh</h1>
			<p>Technology Entrepreneur • Founder • Computer Scientist</p>
		</div>

		<div id="container"></div>
		<div id="overlay"></div>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
		<script>
			// Smooth scroll variables
			let targetScroll = 0;
			let currentScroll = 0;
			const scrollDamping = 0.08;

			// Initialize Vanta clouds
			const vantaEffect = VANTA.CLOUDS({
				el: "#container",
				mouseControls: true,
				touchControls: true,
				gyroControls: false,
				minHeight: 200.00,
				minWidth: 200.00,
				skyColor: 0xa80ca,
				cloudColor: 0xadc1de,
				cloudShadowColor: 0x183550,
				sunColor: 0xff9919,
				sunGlareColor: 0xff6633,
				sunlightColor: 0xff9933,
				speed: 1.00
			});

			// Scroll handling
			let isDragging = false;
			let startY = 0;
			let startScrollTop = 0;

			document.addEventListener('mousedown', onMouseDown);
			document.addEventListener('mousemove', onMouseMove);
			document.addEventListener('mouseup', onMouseUp);
			window.addEventListener('wheel', onWheel, { passive: false });
			window.addEventListener('resize', onWindowResize);

			function onMouseDown(event) {
				isDragging = true;
				startY = event.clientY;
				startScrollTop = targetScroll;
			}

			function onMouseMove(event) {
				if (!isDragging) return;
				
				const currentY = event.clientY;
				const deltaY = currentY - startY;
				const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
				
				targetScroll = Math.max(0, Math.min(maxScroll, startScrollTop - deltaY));
			}

			function onMouseUp() {
				isDragging = false;
			}

			function onWheel(event) {
				event.preventDefault();

				const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
				const scrollAmount = event.deltaY;
				targetScroll = Math.max(0, Math.min(maxScroll, targetScroll + scrollAmount));
			}

			function onWindowResize() {
				if (vantaEffect) {
					vantaEffect.resize();
				}
			}

			function updateTransition(scrollPos, maxScroll) {
				const rawScrollPercent = scrollPos / maxScroll;
				let modifiedScrollPercent = rawScrollPercent;

				if (modifiedScrollPercent < 0.5) {
					modifiedScrollPercent = modifiedScrollPercent * 0.5;
				} else {
					modifiedScrollPercent = 0.25 + (modifiedScrollPercent - 0.5) * 1.5;
				}

			const heroText = document.getElementById('hero-text');
			const logoContainer = document.getElementById('logo-container');
			
			if (heroText && logoContainer) {
				const textOpacity = Math.max(0, 1 - rawScrollPercent * 1.1);
				heroText.style.opacity = textOpacity;
				
				const logoProgress = Math.min(1, rawScrollPercent);
				
				logoContainer.style.top = `calc((50% - 60px) - ((50% - 60px) - 60px) * ${logoProgress})`;
				logoContainer.style.left = `calc(50% - (50% - 60px) * ${logoProgress})`;
				
				const scale = 1 - (logoProgress * 0.4);
				logoContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;
			}				const overlay = document.getElementById('overlay');
				overlay.style.height = `${modifiedScrollPercent * 100}%`;
			}

			// Initialize scroll position
			targetScroll = window.pageYOffset || document.documentElement.scrollTop;
			currentScroll = targetScroll;

			// Animation loop
			function animate() {
				const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
				
				currentScroll += (targetScroll - currentScroll) * scrollDamping;
				
				if (Math.abs(targetScroll - currentScroll) < 0.1) {
					currentScroll = targetScroll;
				}

				window.scrollTo(0, currentScroll);
				updateTransition(currentScroll, maxScroll);

				requestAnimationFrame(animate);
			}

			animate();
		</script>
	</body>
</html>
