<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Ocean Shader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				margin: 0;
				overflow-x: hidden;
				overflow-y: scroll;
				height: 500vh; /* Allow scrolling */
			}
			#container {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100vh;
				z-index: 1;
			}
			#overlay {
				position: fixed;
				bottom: 0;
				left: 0;
				width: 100%;
				height: 0;
				pointer-events: none;
				z-index: 2;
				background-color: #000;
			}
		</style>
	</head>
	<body>

		<div id="container"></div>
		<div id="overlay"></div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">
			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Water } from 'three/addons/objects/Water.js';

			let container;
			let camera, scene, renderer;
			let controls, water, sunLight;
			let skyboxTexture, underwaterColor;

			init();

			function init() {

				container = document.getElementById( 'container' );

				//

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.5;
				container.appendChild( renderer.domElement );

				//

				scene = new THREE.Scene();
				scene.fog = new THREE.FogExp2( 0xccaa88, 0.0005 );

				camera = new THREE.PerspectiveCamera( 55, window.innerWidth / window.innerHeight, 1, 20000 );
				camera.position.set( 30, 30, 100 );

				//

				// Sun Light
				sunLight = new THREE.DirectionalLight( 0xffff55, 1 );
				sunLight.position.set( -600, 300, 600 );
				scene.add( sunLight );

				// Water

				const waterGeometry = new THREE.PlaneGeometry( 10000, 10000 );

				water = new Water(
					waterGeometry,
					{
						textureWidth: 512,
						textureHeight: 512,
						waterNormals: new THREE.TextureLoader().load( 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/waternormals.jpg', function ( texture ) {

							texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
							texture.repeat.set( 10, 10 );

						} ),
						sunDirection: sunLight.position.clone().normalize(),
						sunColor: 0xffffff,
						waterColor: 0x001e0f,
						distortionScale: 3.7,
						fog: scene.fog !== undefined
					}
				);

				water.rotation.x = - Math.PI / 2;
				water.material.side = THREE.DoubleSide;

				scene.add( water );

				// Skybox
				const cubeTextureLoader = new THREE.CubeTextureLoader();
				skyboxTexture = cubeTextureLoader.load([
					'https://jbouny.github.io/ocean/demo/assets/img/px.jpg',
					'https://jbouny.github.io/ocean/demo/assets/img/nx.jpg',
					'https://jbouny.github.io/ocean/demo/assets/img/py.jpg',
					'https://jbouny.github.io/ocean/demo/assets/img/ny.jpg',
					'https://jbouny.github.io/ocean/demo/assets/img/pz.jpg',
					'https://jbouny.github.io/ocean/demo/assets/img/nz.jpg',
				]);
				scene.background = skyboxTexture;
				
				underwaterColor = new THREE.Color( 0x001e0f );

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 10, 0 );
				controls.minDistance = 40.0;
				controls.maxDistance = 200.0;
				controls.enableZoom = false; // Disable mouse wheel zoom
				controls.update();

				//

				window.addEventListener( 'resize', onWindowResize );
				window.addEventListener( 'wheel', onWheel, { passive: false } );

			}

			function onWheel( event ) {

				event.preventDefault();

				// Get current scroll position
				const currentScroll = window.pageYOffset || document.documentElement.scrollTop;
				const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
				
				// Update scroll position
				const scrollAmount = event.deltaY;
				const newScroll = Math.max(0, Math.min(maxScroll, currentScroll + scrollAmount));
				window.scrollTo(0, newScroll);

				// Apply diving effect
				const scrollPercent = newScroll / maxScroll;

				// Update camera position - move closer to water but stay above
				camera.position.y = 30 - (scrollPercent * 25); 
				camera.lookAt( 0, camera.position.y, 0 );
				
				if ( controls ) {
					controls.target.set( 0, camera.position.y, 0 );
				}

				// Update overlay - rising black curtain
				const overlay = document.getElementById('overlay');
				overlay.style.height = `${scrollPercent * 100}%`;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				render();

			}

			function render() {

				water.material.uniforms[ 'time' ].value += 1.0 / 60.0;

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
