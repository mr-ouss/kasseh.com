<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Ocean Shader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		
		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

		<style>
			body {
				margin: 0;
				overflow-x: hidden;
				overflow-y: scroll;
				height: 500vh; /* Allow scrolling */
				font-family: 'Inter', sans-serif;
			}
			#container {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100vh;
				z-index: 1;
			}
			#overlay {
				position: fixed;
				bottom: 0;
				left: 0;
				width: 100%;
				height: 0;
				pointer-events: none;
				z-index: 2;
				background-color: #000;
			}

			/* Hero Styles */
			#hero-wrapper {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
				z-index: 3; /* Above overlay for logo */
			}

			#logo-container {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: 150px;
				height: 150px;
				display: flex;
				align-items: center;
				justify-content: center;
				pointer-events: auto; /* Enable pointer events for hover */
				/* Transition for the movement to top-left */
				/* We will handle top/left via JS or CSS var, but let's use JS for sync with scroll */
			}

			#hero-logo {
				width: 100%;
				height: auto;
				filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
				/* Rotation will be applied here via JS */
				transition: transform 0.1s ease-out, filter 0.3s ease;
				will-change: transform;
			}

			#hero-logo:hover {
				filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
			}

			#hero-text {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				text-align: center;
				color: white;
				margin-top: 120px; /* Offset from center to be below logo */
				z-index: 2; /* Above container */
				pointer-events: none;
				transition: opacity 0.2s ease-out;
				width: 100%;
			}

			#hero-text h1 {
				font-family: 'Inter', sans-serif;
				font-size: 3rem;
				margin: 0;
				font-weight: 700;
				text-shadow: 0 4px 10px rgba(0,0,0,0.5);
				letter-spacing: -0.02em;
			}

			#hero-text p {
				font-family: 'Inter', sans-serif;
				font-size: 1rem;
				margin: 12px 0 0;
				opacity: 0.9;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				text-shadow: 0 2px 5px rgba(0,0,0,0.5);
				font-weight: 300;
			}
		</style>
	</head>
	<body>

		<div id="hero-wrapper">
			<div id="logo-container">
				<img src="../kasseh-logo-white.svg" id="hero-logo" alt="Kasseh Logo">
			</div>
		</div>
		
		<div id="hero-text">
			<h1>Quentin Kasseh</h1>
			<p>Technology Entrepreneur • Founder • Computer Scientist</p>
		</div>

		<div id="container"></div>
		<div id="overlay"></div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">
			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Water } from 'three/addons/objects/Water.js';
			import { Sky } from 'three/addons/objects/Sky.js';

			let container;
			let camera, scene, renderer;
			let controls, water, sunLight;
			let underwaterColor;

			// Smooth scroll variables
			let targetScroll = 0;
			let currentScroll = 0;
			const scrollDamping = 0.08;

			init();

			function init() {

				container = document.getElementById( 'container' );

				//

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.5;
				container.appendChild( renderer.domElement );

				//

				scene = new THREE.Scene();
				scene.fog = new THREE.FogExp2( 0xccaa88, 0.0005 );

				camera = new THREE.PerspectiveCamera( 55, window.innerWidth / window.innerHeight, 1, 20000 );
				camera.position.set( 30, 30, 100 );

				//

				// Sun Light
				sunLight = new THREE.DirectionalLight( 0xffff55, 1 );
				sunLight.position.set( -600, 300, 600 );
				scene.add( sunLight );

				// Sky
				const sky = new Sky();
				sky.scale.setScalar( 10000 );
				scene.add( sky );

				const skyUniforms = sky.material.uniforms;
				skyUniforms[ 'turbidity' ].value = 10;
				skyUniforms[ 'rayleigh' ].value = 2;
				skyUniforms[ 'mieCoefficient' ].value = 0.005;
				skyUniforms[ 'mieDirectionalG' ].value = 0.8;

				const sun = new THREE.Vector3();
				sun.copy( sunLight.position ).normalize();
				sky.material.uniforms[ 'sunPosition' ].value.copy( sun );

				// Water

				const waterGeometry = new THREE.PlaneGeometry( 10000, 10000 );

				water = new Water(
					waterGeometry,
					{
						textureWidth: 512,
						textureHeight: 512,
						waterNormals: new THREE.TextureLoader().load( 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/waternormals.jpg', function ( texture ) {

							texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
							texture.repeat.set( 10, 10 );

						} ),
						sunDirection: sunLight.position.clone().normalize(),
						sunColor: 0xffffff,
						waterColor: 0x001e0f,
						distortionScale: 3.7,
						fog: scene.fog !== undefined
					}
				);

				water.rotation.x = - Math.PI / 2;
				water.material.side = THREE.DoubleSide;

				scene.add( water );
				
				underwaterColor = new THREE.Color( 0x001e0f );

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 10, 0 );
				controls.minDistance = 40.0;
				controls.maxDistance = 200.0;
				controls.enableZoom = false; // Disable mouse wheel zoom
				controls.update();

				//

				window.addEventListener( 'resize', onWindowResize );
				window.addEventListener( 'wheel', onWheel, { passive: false } );
				
				// Drag to scroll
				document.addEventListener('mousedown', onMouseDown);
				document.addEventListener('mousemove', onMouseMove);
				document.addEventListener('mouseup', onMouseUp);
				
				// Logo rotation
				document.addEventListener('mousemove', onLogoMouseMove);

				// Initialize scroll position
				targetScroll = window.pageYOffset || document.documentElement.scrollTop;
				currentScroll = targetScroll;

			}

			function onLogoMouseMove(event) {
				const logo = document.getElementById('hero-logo');
				if (!logo) return;

				// Calculate mouse position relative to center (from -1 to 1)
				const x = (event.clientX / window.innerWidth) * 2 - 1;
				const y = (event.clientY / window.innerHeight) * 2 - 1;

				// Rotate logo based on mouse position
				// Max rotation: 20 degrees
				// Perspective is set in CSS or here? Let's set it here.
				// rotateY follows x (left/right), rotateX follows -y (up/down)
				logo.style.transform = `perspective(1000px) rotateY(${x * 20}deg) rotateX(${-y * 20}deg)`;
			}

			let isDragging = false;
			let startY = 0;
			let startScrollTop = 0;

			function onMouseDown(event) {
				isDragging = true;
				startY = event.clientY;
				startScrollTop = targetScroll;
			}

			function onMouseMove(event) {
				if (!isDragging) return;
				
				const currentY = event.clientY;
				const deltaY = currentY - startY;
				const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
				
				// Update target directly
				targetScroll = Math.max(0, Math.min(maxScroll, startScrollTop - deltaY));
			}

			function onMouseUp() {
				isDragging = false;
			}

			function updateTransition(scrollPos, maxScroll) {
				const rawScrollPercent = scrollPos / maxScroll;
				let modifiedScrollPercent = rawScrollPercent;

				// Speed up the dive after 50%
				// Map 0.0-0.5 -> 0.0-0.25 (slower)
				// Map 0.5-1.0 -> 0.25-1.0 (faster)
				if (modifiedScrollPercent < 0.5) {
					modifiedScrollPercent = modifiedScrollPercent * 0.5;
				} else {
					modifiedScrollPercent = 0.25 + (modifiedScrollPercent - 0.5) * 1.5;
				}

				// Hero Animation
				const heroText = document.getElementById('hero-text');
				const logoContainer = document.getElementById('logo-container');
				
				if (heroText && logoContainer) {
					// Text follows linear scroll speed
					// Fade out linearly as user scrolls, fully gone just before the end
					const textOpacity = Math.max(0, 1 - rawScrollPercent * 1.1);
					heroText.style.opacity = textOpacity;
					
					// Logo follows linear scroll speed
					const logoProgress = Math.min(1, rawScrollPercent);
					
					// Interpolate position
					// Start: 50%, End: 60px
					logoContainer.style.top = `calc(50% - (50% - 60px) * ${logoProgress})`;
					logoContainer.style.left = `calc(50% - (50% - 60px) * ${logoProgress})`;
					
					// Scale down slightly (1 -> 0.6)
					const scale = 1 - (logoProgress * 0.4);
					logoContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;
				}

				// Update camera position - move closer to water but stay above
				camera.position.y = 30 - (modifiedScrollPercent * 25); 
				camera.lookAt( 0, camera.position.y, 0 );
				
				if ( controls ) {
					controls.target.set( 0, camera.position.y, 0 );
				}

				// Update overlay - rising black curtain
				const overlay = document.getElementById('overlay');
				overlay.style.height = `${modifiedScrollPercent * 100}%`;
			}

			function onWheel( event ) {

				event.preventDefault();

				const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
				
				// Update target scroll
				const scrollAmount = event.deltaY;
				targetScroll = Math.max(0, Math.min(maxScroll, targetScroll + scrollAmount));

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				// Smooth scroll interpolation
				const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
				
				// Lerp
				currentScroll += (targetScroll - currentScroll) * scrollDamping;
				
				// Snap
				if (Math.abs(targetScroll - currentScroll) < 0.1) {
					currentScroll = targetScroll;
				}

				// Sync native scrollbar
				window.scrollTo(0, currentScroll);

				updateTransition(currentScroll, maxScroll);

				render();

			}

			function render() {

				water.material.uniforms[ 'time' ].value += 1.0 / 60.0;

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
